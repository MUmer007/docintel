[project]
name = "docintel"
version = "0.1.0"
description = "Production RAG + agent platform for enterprise document Q&A, with a first-class LLM eval harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM clients
    "groq>=0.11.0",
    "anthropic>=0.40.0",          # used as independent LLM-as-judge to avoid same-model bias
    "openai>=1.54.0",             # optional provider + embeddings fallback
    # Retrieval
    "chromadb>=0.5.20",
    "sentence-transformers>=3.2.0",
    "rank-bm25>=0.2.2",           # sparse retrieval for hybrid search
    # Ingestion / parsing
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.4",         # table extraction from PDFs
    "unstructured>=0.16.0",
    "tiktoken>=0.8.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Agents / tools
    "duckdb>=1.1.0",              # SQL tool over structured financial data
    "numexpr>=2.10.0",            # safe calculator tool
    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "structlog>=24.4.0",
    # Utilities
    "httpx>=0.27.0",
    "tenacity>=9.0.0",            # retries with backoff for API calls
    "python-dotenv>=1.0.1",
    "typer>=0.13.0",              # CLI for scripts (ingest, eval, serve)
    "rich>=13.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "ipykernel>=6.29.0",
]
eval = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "deepeval>=2.0.0",
]

[project.scripts]
docintel = "docintel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast unit tests, no external calls",
    "integration: hits real Chroma/LLM APIs, run selectively",
    "eval: LLM eval suite, run in CI on a schedule + on PR for regression",
]